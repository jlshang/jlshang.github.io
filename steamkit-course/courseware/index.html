<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><script src="../gate.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEAMKit 专项直播课</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700;900&display=swap">
<style>
  :root{
    --ink:#1E2A44; --ink2:#141C30; --paper:#FBF6EC; --card:#FFFDF8; --line:#E8DFCC;
    --orange:#E8742A; --orange-d:#C65A16; --sun:#FFC60A; --muted:#6B7590;
    --display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ink);color:var(--paper);font-family:var(--body);min-height:100vh;
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .wrap{max-width:1080px;margin:0 auto}
  header{padding:40px 0 28px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;gap:10px}
  .kicker{font-size:14px;letter-spacing:.12em;color:var(--sun);font-weight:700}
  h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,52px);line-height:1.1}
  h1 span{color:var(--orange)}
  .sub{margin:0;color:#C9D1E4;font-size:16px}
  .count{font-size:14px;color:#C9D1E4;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:8px 14px;border-radius:999px;white-space:nowrap}
  .grid{display:flex;flex-direction:column;gap:14px}
  .card{display:flex;flex-direction:row;background:var(--card);color:var(--ink);border-radius:20px;overflow:hidden;text-decoration:none;
    box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .2s ease,box-shadow .2s ease;border:3px solid transparent}
  .card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.35);border-color:var(--sun);outline:none}
  .thumb{position:relative;width:220px;min-width:220px;aspect-ratio:16/9;background:var(--ink2);overflow:hidden;display:flex;align-items:center;justify-content:center}
  .thumb img{width:76%;height:76%;object-fit:contain;display:block;margin-top:14px;border-radius:12px;transition:transform .35s ease}
  .card:hover .thumb img{transform:scale(1.04)}
  .no{position:absolute;left:14px;top:14px;background:var(--orange);color:#fff;font-family:var(--display);font-size:20px;padding:4px 14px;border-radius:12px;box-shadow:0 4px 0 var(--orange-d)}
  .body{padding:18px 24px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;justify-content:center;gap:8px;flex:1;min-width:0}
  .title{font-family:var(--display);font-size:28px;line-height:1.2}
  .q{margin:0;color:#3D4A66;font-size:15px}
  .go{margin-top:0;padding-top:4px;width:100%;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13.5px}
  .go b{color:var(--orange);font-size:15px}
  .unit{margin:34px 0 14px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .unit:first-child{margin-top:0}
  .unit h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;color:var(--paper)}
  .unit h2 b{color:var(--orange);font-weight:400;margin-right:10px}
  .unit span{color:#AEB7CC;font-size:15px}
  .card.soon{cursor:default;opacity:.62;box-shadow:none}
  .card.soon:hover{transform:none;border-color:transparent;box-shadow:none}
  .card.soon .thumb{background:repeating-linear-gradient(135deg,#1A2338 0 14px,#1E2840 14px 28px)}
  .soon-mark{font-family:var(--display);font-size:22px;color:#C9D1E4;letter-spacing:.1em}
  .card.soon .go b{color:var(--muted)}
  footer{margin-top:36px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#AEB7CC;font-size:13.5px}
  footer a{color:var(--sun)}
  @media (max-width:520px){header{padding-top:22px}.card{border-radius:14px}.thumb{width:110px;min-width:110px;aspect-ratio:auto}.thumb img{width:90%;height:auto;margin-top:10px}.no{left:6px;top:6px;padding:2px 7px;font-size:13px;border-radius:7px}.body{padding:12px;gap:5px}.title{font-size:20px}.q{font-size:13px}.go{font-size:12px}.go b{font-size:13px}.soon-mark{font-size:16px}}
  @media (prefers-reduced-motion:reduce){.card,.thumb img{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>STEAMKit <span>专项直播课</span></h1>
    </div>
  </header>

  <main id="list" aria-label="课程列表"></main>

  <footer>
    <span>上课时按 ← → 翻页，N 看讲师备注，F 全屏</span>
  </footer>
</div>
<script>
// 课程按确认后的顺序排列；新课上线时补充 href、img 和 pages。
const LESSONS = [
  { no: 1, unit: 0, title: "碳的变身术", q: "同样是碳，铅笔芯为什么软、钻石为什么硬？", href: "../lesson01-tan-bianshenshu/", img: "img/l01.webp?v=1", pages: 21 },
  { no: 2, unit: 0, title: "六瓣的奇迹", q: "雪花为什么都是六个瓣？", href: "../lesson03-liuban-qiji/", img: "img/l03.webp?v=2", pages: 27 },
  { no: 3, unit: 0, title: "空间大力士", q: "大桥为什么都是三角形？", href: "../lesson05-kongjian-dalishi/", img: "img/l05.webp", pages: 28 },
  { no: 4, unit: 0, title: "转不倒的陀螺", q: "怎样的陀螺转得最久？" },
  { no: 5, unit: 1, title: "盐粒的形状", q: "厨房里的盐，为什么都是小方块？", href: "../lesson04-yanli-xiaofangkuai/", img: "img/l04.webp", pages: 20 },
  { no: 6, unit: 1, title: "吹出方形泡泡", q: "立方体框里，会出现什么形状的泡泡？" },
  { no: 7, unit: 1, title: "生命的螺旋楼梯", q: "DNA 的双螺旋里，藏着什么秘密？", href: "../lesson02-dna/", img: "img/l08.webp", pages: 19 },
  { no: 8, unit: 1, title: "影子里的四维", q: "手电筒照出的「方块套方块」，是谁的影子？" },
  { no: 9, unit: 2, title: "病毒的盔甲", q: "放大上万倍，病毒为什么像一颗多面骰子？", href: "../lesson07-shijunti/", img: "img/l07.webp?v=2", pages: 16 },
  { no: 10, unit: 2, title: "球馆屋顶的秘密", q: "体育馆的大圆顶，是用什么拼的？" },
  { no: 11, unit: 2, locked: true, title: "世界的五张王牌", q: "为什么正多面体只有五种？", href: "../lesson10-bolatu-duomianti/", img: "img/l10.webp?v=6", pages: 17 },
  { no: 12, unit: 2, locked: true, title: "开普勒的宇宙世界", q: "五位伙伴套起来，谁在最里面？", href: "../lesson11-kaipule-yuzhou/", img: "img/l11.webp?v=3", pages: 20 },
];
const list = document.getElementById("list");
const grid = document.createElement("div");
grid.className = "grid";
LESSONS.sort((a, b) => a.no - b.no).forEach((l) => {
  const ready = !!l.href && !l.locked;
  const c = document.createElement(ready ? "a" : "div");
  c.className = ready ? "card" : "card soon";
  if (ready) c.href = l.href;
  const thumb = l.img ? `<img src="${l.img}" alt="${l.title} 封面" loading="lazy">` : `<span class="soon-mark">制作中</span>`;
  const status = l.locked ? "暂不开放" : "即将上线";
  c.innerHTML = `<div class="thumb">${thumb}<div class="no">第 ${l.no} 节</div></div>
    <div class="body"><div class="title">${l.title}</div><p class="q">${l.q}</p>
    <div class="go"><span>${ready ? l.pages + " 页" : ""}</span><b>${ready ? "开始上课 →" : status}</b></div></div>`;
  grid.appendChild(c);
});
list.appendChild(grid);
</script>
</body>
</html>
