<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Buddy</title><link rel="stylesheet" href="../../../shared/style.css"><style>.sp{display:grid;gap:8px;margin:14px auto 0;max-width:420px;background:#E9E3D7;padding:8px;border-radius:18px}.st{aspect-ratio:1;border-radius:14px;border:0;background:var(--surface);box-shadow:0 3px 0 var(--line);font-size:2rem;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit}.st.blank{background:transparent;box-shadow:none;cursor:default}.st.ok{color:var(--good)}.goal{display:flex;align-items:center;gap:12px;font-size:1rem;color:var(--muted)}.mini{display:grid;gap:2px;width:64px}.mini i{aspect-ratio:1;background:var(--surface);font-style:normal;font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:3px}.row2{display:flex;gap:12px;margin-top:14px}.row2 .btn{flex:1}</style></head>
<body><div class="wrap"></div>
<script src="../../../shared/icons.js"></script>
<script src="../../../shared/audio.js"></script>
<script src="../../../shared/common.js" data-root="../../../"></script>
<script>
var PATH='games/logic/sliding-puzzle/index.html',T=Brain.T,ZH=Brain.LANG==='zh';

Brain.run({id:'sliding-puzzle',cat:'logic',icon:'slide',title:{en:'Sliding Puzzle',zh:'数字华容道'},
 rules:{en:'Put the numbers back <b>in order</b>, left to right and top to bottom.<br><br>Tap a number next to the empty space to slide it.<br><br>Early levels need only a few moves.',zh:'把数字按<b>从小到大</b>的顺序排好：从左到右、从上到下。<br><br>点空格旁边的数字，它就会滑过去。<br><br>前几关只需要移动几步。'}},
function(L){
  /* gentle: L1 is 2 moves from solved on a 3x3 board; 4x4 only appears at L9-10 */
  var size=L<=8?3:4,N=size*size,shuffleMoves=[2,3,5,7,10,14,18,24,8,14][L-1],board,moves=0,done=false,w=document.querySelector('.wrap');
  w.insertAdjacentHTML('beforeend','<div class="card goal"><div class="mini" style="grid-template-columns:repeat('+size+',1fr)">'+Array.from({length:N},(_,i)=>'<i>'+(i<N-1?i+1:'')+'</i>').join('')+'</div><span>'+T({en:'Goal: numbers in order, empty space at the end.',zh:'目标：数字按顺序排好，空格在最后。'})+'</span></div><div class="status" id="st" style="margin-top:10px"></div><div id="sp" class="sp"></div><div id="fb" class="feedback"></div><div class="row2"><button class="btn secondary" id="reset">'+T({en:'Start over',zh:'重新开始'})+'</button><button class="btn secondary" id="give">'+T({en:'Show solved',zh:'看答案'})+'</button></div>');
  var sp=document.getElementById('sp'),fb=document.getElementById('fb');sp.style.gridTemplateColumns='repeat('+size+',1fr)';
  function nb(i){var r=Math.floor(i/size),c=i%size,o=[];if(r>0)o.push(i-size);if(r<size-1)o.push(i+size);if(c>0)o.push(i-1);if(c<size-1)o.push(i+1);return o}
  var solved=Array.from({length:N},(_,i)=>i<N-1?i+1:0),startBoard;
  function scramble(){var b=solved.slice(),blank=N-1,prev=-1;for(var k=0;k<shuffleMoves;k++){var opts=nb(blank).filter(x=>x!==prev),m=Brain.pick(opts);b[blank]=b[m];b[m]=0;prev=blank;blank=m}
    return b.join()===solved.join()?scramble():b}
  function draw(){sp.innerHTML='';board.forEach(function(v,i){var b=document.createElement('button');b.className='st'+(v?'':' blank')+(v&&v===i+1?' ok':'');b.textContent=v||'';
    b.onclick=function(){if(done||!v)return;var blank=board.indexOf(0);if(nb(i).includes(blank)){board[blank]=v;board[i]=0;moves++;draw();check()}else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}};sp.appendChild(b)});
    document.getElementById('st').innerHTML='<span>'+T({en:'Moves: ',zh:'已移动 '})+moves+T({en:'',zh:' 步'})+'</span><span>'+T({en:'In place: ',zh:'已归位 '})+board.filter((v,i)=>v&&v===i+1).length+' / '+(N-1)+'</span>';
    Brain.progress(board.filter((v,i)=>v&&v===i+1).length,N-1)}
  function check(){if(board.join()===solved.join()){done=true;Brain.say(fb,true,{en:'Solved! Well done.',zh:'完成啦，真厉害！'});setTimeout(function(){Brain.finish({score:1,total:1,note:{en:'Solved in '+moves+' moves',zh:'用了 '+moves+' 步'}})},1200)}}
  startBoard=scramble();board=startBoard.slice();draw();
  document.getElementById('reset').onclick=function(){if(done)return;board=startBoard.slice();moves=0;fb.textContent='';draw()};
  document.getElementById('give').onclick=function(){if(done)return;done=true;board=solved.slice();draw();Brain.say(fb,false,{en:'This is the finished board.',zh:'这就是排好的样子。'});setTimeout(function(){Brain.finish({score:0,total:1})},2200)};
});
</script></body></html>
