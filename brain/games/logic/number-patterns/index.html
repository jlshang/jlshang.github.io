<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Buddy</title><link rel="stylesheet" href="../../../shared/style.css"><style>
.river{position:relative;height:500px;margin-top:4px;border-radius:28px;overflow:hidden;touch-action:manipulation;
  background:linear-gradient(90deg,#3F8FA3 0%,#5AAFBE 18%,#6CC0C8 50%,#5AAFBE 82%,#3F8FA3 100%);box-shadow:var(--shadow)}
.river:before,.river:after{content:"";position:absolute;top:0;bottom:0;width:26px;z-index:2;background:repeating-linear-gradient(#7DB66A 0 22px,#6AA85A 22px 44px)}
.river:before{left:0}.river:after{right:0}
.flow{position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 60px,rgba(255,255,255,.12) 60px 62px,transparent 62px 120px);animation:flow 5s linear infinite;pointer-events:none}
@keyframes flow{to{background-position:0 120px}}
.world{position:absolute;left:0;right:0;bottom:0;transition:transform .7s cubic-bezier(.4,.1,.3,1)}
.bank{position:absolute;left:0;right:0;height:96px;background:linear-gradient(#E9D6A8,#D9C08A);border-top:6px solid #C9AE76}
.bank.far{background:linear-gradient(#8CC47A,#76B064);border-bottom:6px solid #5E9A50;border-top:0}
.bank .flag{position:absolute;right:40px;top:14px;width:54px;height:54px}
.lily{position:absolute;width:104px;height:84px;margin-left:-52px;border:0;background:none;padding:0;cursor:pointer;transition:transform .3s,opacity .4s}
.lily svg{position:absolute;inset:0;width:100%;height:100%}
.lily b{position:absolute;left:0;right:0;top:25px;text-align:center;font-size:1.75rem;font-weight:900;color:#1C3A26;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.lily.trail b{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.lily.ahead{cursor:default}.lily.ahead b{opacity:0}
.lily.faded{opacity:0;pointer-events:none;transform:scale(.6)}
.lily.sink{animation:sink .8s ease}
@keyframes sink{30%{transform:translateY(8px) scale(.92)}60%{transform:translateY(2px) rotate(-6deg)}100%{transform:none}}
.lily.glow svg{filter:drop-shadow(0 0 10px #FFF3A0) drop-shadow(0 0 4px #FFE066)}
.lily.next{animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.frog{position:absolute;width:62px;height:62px;margin:-40px 0 0 -31px;z-index:3;transition:left .55s cubic-bezier(.3,.7,.4,1),top .55s cubic-bezier(.3,.7,.4,1);pointer-events:none}
.frog.jump svg{animation:jump .55s ease}
@keyframes jump{0%{transform:scale(1)}45%{transform:scale(1.35) translateY(-18px)}100%{transform:scale(1)}}
.frog.shake svg{animation:shake .4s}
.rule{position:absolute;left:36px;right:36px;top:12px;z-index:4;background:rgba(255,255,255,.94);border-radius:16px;padding:8px 12px;text-align:center;font-weight:800;font-size:1.05rem;box-shadow:var(--shadow);transition:opacity .3s}
.rule small{display:block;font-weight:600;color:var(--muted);font-size:.85rem}
.say2{text-align:center;font-weight:800;font-size:1.15rem;min-height:1.6em;margin-top:10px}
.say2.good{color:var(--good)}.say2.try{color:var(--warn)}
.flies{display:flex;gap:4px}.flies span{width:22px;height:22px;display:block;opacity:.25}.flies span.on{opacity:1;animation:pulse .5s}
.bigicon{width:96px;height:96px;margin:0 auto}
</style></head>
<body><div class="wrap"></div>
<script src="../../../shared/icons.js"></script>
<script src="../../../shared/audio.js"></script>
<script src="../../../shared/common.js" data-root="../../../"></script>
<script>
var PATH='games/logic/number-patterns/index.html',T=Brain.T,ZH=Brain.LANG==='zh';

var I=Brain.I;
function lilySVG(kind){
  if(kind==='trail')return '<svg viewBox="0 0 104 84"><ellipse cx="52" cy="46" rx="48" ry="32" fill="#3F7F4A" opacity=".25"/><path d="M52 42L100 36A48 32 0 1 1 94 22z" fill="#4E9A58"/><path d="M52 42L22 26M52 42L34 70M52 42L80 68" stroke="#3F7F4A" stroke-width="2"/></svg>';
  return '<svg viewBox="0 0 104 84"><ellipse cx="52" cy="48" rx="48" ry="32" fill="#2F6F7E" opacity=".25"/><path d="M52 42L100 36A48 32 0 1 1 94 22z" fill="#78C06A"/><path d="M52 42L22 26M52 42L34 70M52 42L80 68" stroke="#5FA052" stroke-width="2"/></svg>'}
var FROG='<svg viewBox="0 0 74 74"><ellipse cx="37" cy="48" rx="26" ry="19" fill="#5DAA6E"/><ellipse cx="37" cy="52" rx="16" ry="11" fill="#A7D98F"/><circle cx="23" cy="26" r="11" fill="#5DAA6E"/><circle cx="51" cy="26" r="11" fill="#5DAA6E"/><circle cx="23" cy="25" r="6.5" fill="#fff"/><circle cx="51" cy="25" r="6.5" fill="#fff"/><circle cx="24" cy="25" r="3.4" fill="#1C2826"/><circle cx="52" cy="25" r="3.4" fill="#1C2826"/><path d="M26 44q11 8 22 0" stroke="#2F6B3E" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M12 62q-6 4-8 0M62 62q6 4 8 0" stroke="#4A8A5A" stroke-width="5" fill="none" stroke-linecap="round"/></svg>';

/* number rules, easiest first. Each returns a sequence of length n and a spoken explanation. */
var RULES=[
 function(n){var a=Brain.rand(1,5);return{s:Array.from({length:n},(_,i)=>a+i),why:{en:'Add 1 each hop',zh:'每跳一次加 1'}}},
 function(n){var a=Brain.rand(1,6),d=Brain.pick([2,2,5,10]);return{s:Array.from({length:n},(_,i)=>a+d*i),why:{en:'Add '+d+' each hop',zh:'每跳一次加 '+d}}},
 function(n){var d=Brain.pick([1,2,5]),a=d*(n+Brain.rand(3,8));return{s:Array.from({length:n},(_,i)=>a-d*i),why:{en:'Take away '+d+' each hop',zh:'每跳一次减 '+d}}},
 function(n){var a=Brain.pick([2,3,5]),d=Brain.pick([3,4]);return{s:Array.from({length:n},(_,i)=>a+d*i),why:{en:'Add '+d+' each hop',zh:'每跳一次加 '+d}}},
 function(n){var a=Brain.rand(1,3);return{s:Array.from({length:n},(_,i)=>a*Math.pow(2,i)),why:{en:'Double it each hop',zh:'每跳一次乘以 2'}}},
 function(n){var a=Brain.rand(1,4);return{s:Array.from({length:n},(_,i)=>a+i*(i+1)/2),why:{en:'Add 1, then 2, then 3...',zh:'依次加 1、加 2、加 3……'}}},
 function(n){var a=Brain.rand(1,4),b=Brain.rand(10,14);return{s:Array.from({length:n},(_,i)=>i%2?b+(i-1)/2:a+i/2),why:{en:'Two rows of numbers take turns',zh:'两组数字轮流出现，各自加 1'}}},
 function(n){var s=Brain.rand(1,2);return{s:Array.from({length:n},(_,i)=>(i+s)*(i+s)),why:{en:'1×1, 2×2, 3×3...',zh:'依次是 1×1、2×2、3×3……'}}},
 function(n){var a=1,b=Brain.rand(1,2),s=[a,b];while(s.length<n)s.push(s[s.length-1]+s[s.length-2]);return{s:s,why:{en:'Add the two numbers before',zh:'每个数等于前两个数相加'}}}];

Brain.run({id:'number-patterns',music:'frog',cat:'logic',icon:'frog',title:{en:'Frog Crossing',zh:'青蛙过河'},
 rules:{en:'Help the frog cross the river on lily pads.<br><br>The numbers on the pads behind the frog follow a <b>rule</b>. Tap the lily pad with the <b>next number</b> to hop.<br><br>A wrong pad just wobbles. The frog waits for you.',zh:'帮小青蛙踩着荷叶过河。<br><br>青蛙走过的荷叶上的数字有<b>规律</b>，请点写着<b>下一个数</b>的荷叶，青蛙就会跳过去。<br><br>点错了荷叶只会晃一晃，青蛙会耐心等您。'}},
function(L){
  var CROSS=L<=3?3:4,HOPS=L<=2?2:L<=6?3:4,PADS=L<=2?2:3,GIVEN=3,ROW=118;
  var avail=RULES.slice(Math.max(0,Math.min(RULES.length,L)-3),Math.min(RULES.length,Math.max(1,L)));
  var cross=0,firstTry=0,totalHops=0,streak=0,best=0,lotus=Brain.store('frog-lotus')||0,rule,row,wrongHere,busy;
  var w=document.querySelector('.wrap');
  w.insertAdjacentHTML('beforeend','<div class="hud" id="hud"><span class="chip"><span class="flies" id="flies"></span></span><span class="chip" id="streak">'+I('flame')+'<span>0</span></span><span class="chip" style="margin-left:auto">'+I('lotus')+'<span id="lotus">'+lotus+'</span></span></div>'+
    '<div class="river" id="river"><div class="flow"></div><div class="world" id="world"></div><div class="rule" id="rule"></div></div><div class="say2" id="say"></div>');
  document.getElementById('hud').appendChild(Brain.soundBtn());
  var river=document.getElementById('river'),world=document.getElementById('world'),say=document.getElementById('say'),ruleBox=document.getElementById('rule');
  var RW=river.clientWidth,RH=river.clientHeight,frog;
  document.getElementById('flies').innerHTML=Array.from({length:CROSS},()=>'<span>'+I('lotus')+'</span>').join('');
  function xs(k,n){var inner=RW-52-104,gap=inner/(n-1||1);return 26+52+gap*k}

  function build(){
    cross++;wrongHere=0;busy=false;rule=Brain.pick(avail)(GIVEN+HOPS);row=GIVEN-1;
    var total=GIVEN+HOPS,height=96+ROW*total+110;world.style.height=height+'px';world.innerHTML='';
    world.insertAdjacentHTML('beforeend','<div class="bank" style="bottom:0"></div><div class="bank far" style="top:0"><svg class="flag" viewBox="0 0 54 54"><path d="M12 50V6" stroke="#8A5A3B" stroke-width="4" stroke-linecap="round"/><path d="M14 8h30l-8 9 8 9H14z" fill="#E0493C"/></svg></div>');
    world._rows=[];
    for(var r=0;r<total;r++){
      var y=height-96-ROW*r-40,correct=Brain.rand(0,PADS-1),val=rule.s[r],opts=[];
      if(r<GIVEN){opts=[{v:val,ok:true}]}
      else{var s=new Set([val]);[val+1,val-1,val+2,val-2,val+Brain.rand(3,6)].forEach(v=>{if(s.size<PADS&&v>=0)s.add(v)});var arr=Brain.shuffle([...s].filter(v=>v!==val));arr.splice(correct,0,val);opts=arr.slice(0,PADS).map(v=>({v:v,ok:v===val}))}
      var pads=opts.map(function(o,k){var n=opts.length,x=r<GIVEN?xs(r%2?PADS-1:0,PADS)*0+RW/2+(r%2?-60:60)*(PADS>2?1:.7):xs(k,n);
        var b=document.createElement('button');b.className='lily '+(r<GIVEN?'trail':'ahead');b.style.left=x+'px';b.style.top=y+'px';b.innerHTML=lilySVG(r<GIVEN?'trail':'pad')+'<b>'+o.v+'</b>';
        b._o=o;b._r=r;b._x=x;b._y=y+84;b.onclick=function(){tapPad(b)};world.appendChild(b);return b});
      world._rows.push(pads);
    }
    frog=document.createElement('div');frog.className='frog';frog.innerHTML=FROG;world.appendChild(frog);
    var start=world._rows[row][0];frog.style.left=start._x+'px';frog.style.top=start._y+'px';
    ruleBox.innerHTML=T({en:'Crossing '+cross+' of '+CROSS,zh:'第 '+cross+' 条河 / 共 '+CROSS+' 条'})+'<small>'+T({en:'Numbers so far: ',zh:'走过的数字：'})+rule.s.slice(0,GIVEN).join(', ')+'</small>';
    ruleBox.style.opacity=1;reveal();scroll();
    Brain.speak(T({en:'Look at the numbers: ',zh:'看看这些数字：'})+rule.s.slice(0,GIVEN).join(', '));
  }
  function trail(){ruleBox.querySelector('small').textContent=T({en:'Numbers so far: ',zh:'走过的数字：'})+rule.s.slice(0,row+2).join(', ')}
  function reveal(){var nx=world._rows[row+1];if(!nx)return;nx.forEach(b=>{b.classList.remove('ahead');b.classList.add('next')});
    var after=world._rows[row+2];if(after)after.forEach(b=>b.classList.add('ahead'))}
  function scroll(){var fy=world._rows[row][0]._y,H=parseFloat(world.style.height);var offset=Math.max(0,Math.min(H-RH,(H-fy)-RH*0.3));world.style.transform='translateY('+offset+'px)'}
  function tapPad(b){
    if(busy||b._r!==row+1)return;
    if(b._o.ok){busy=true;totalHops++;if(wrongHere===0){firstTry++;streak++;best=Math.max(best,streak)}else streak=0;
      var st=document.getElementById('streak');st.querySelector('span').textContent=streak;st.classList.toggle('hot',streak>=3);
      Brain.sfx('hop');frog.classList.remove('jump');void frog.offsetWidth;frog.classList.add('jump');frog.style.left=b._x+'px';frog.style.top=b._y+'px';trail();
      world._rows[row+1].forEach(x=>{x.classList.remove('next','glow');if(x!==b)x.classList.add('faded')});b.classList.remove('ahead');b.classList.add('trail');b.querySelector('svg').outerHTML=lilySVG('trail');
      say.className='say2 good';say.textContent=wrongHere===0?(streak>=3?T({en:streak+' perfect hops in a row!',zh:'连续 '+streak+' 跳全对！'}):Brain.pick(T({en:['Hop!','Nice jump!','Right on!'],zh:['跳！','跳得好！','正是这片！']}))):T({en:'There you go!',zh:'对啦！'});
      row++;wrongHere=0;
      setTimeout(function(){
        if(row>=GIVEN+HOPS-1){landBank()}else{reveal();scroll();busy=false}
      },600);
    }else{
      wrongHere++;b.classList.remove('sink');void b.offsetWidth;b.classList.add('sink');Brain.sfx('splash');
      frog.classList.remove('shake');void frog.offsetWidth;frog.classList.add('shake');
      say.className='say2 try';say.textContent=T({en:'That pad wobbles. Look at how the numbers change.',zh:'这片荷叶晃了晃，看看数字是怎么变的。'});
      if(wrongHere>=2){world._rows[row+1].forEach(x=>{if(x._o.ok)x.classList.add('glow')});say.textContent=T(rule.why)+T({en:'. The glowing pad is the one.',zh:'。发光的那片就是。'})}
    }
  }
  function landBank(){
    busy=true;var H=parseFloat(world.style.height);
    setTimeout(function(){Brain.sfx('hop');frog.classList.remove('jump');void frog.offsetWidth;frog.classList.add('jump');frog.style.left=(RW/2)+'px';frog.style.top='70px';world.style.transform='translateY('+(H-RH)+'px)';},250);
    setTimeout(function(){Brain.sfx('ok');Brain.sfx('croak');lotus++;Brain.store('frog-lotus',lotus);document.getElementById('lotus').textContent=lotus;
      var f=document.querySelectorAll('#flies span')[cross-1];if(f)f.classList.add('on');Brain.progress(cross,CROSS);
      Brain.toast(T({en:'Made it across!',zh:'过河成功！'})+'<br><small style="font-size:.95rem;color:var(--muted)">'+T(rule.why)+'</small>',river,1900);
      Brain.speak(T({en:'Made it across! ',zh:'过河成功！'})+T(rule.why))},900);
    setTimeout(function(){if(cross>=CROSS)end();else build()},3100);
  }
  function end(){Brain.sfx('win');var total=CROSS*HOPS;
    var m=document.createElement('div');m.className='modal';
    m.innerHTML='<div class="card"><div class="bigicon">'+I('frog')+'</div><h2>'+T({en:'The frog is home!',zh:'小青蛙到家啦！'})+'</h2>'+
      '<div class="sumrow"><span>'+T({en:'Rivers crossed',zh:'过了几条河'})+'</span><b>'+CROSS+'</b></div>'+
      '<div class="sumrow"><span>'+T({en:'Perfect hops',zh:'一次就跳对'})+'</span><b>'+firstTry+' / '+total+'</b></div>'+
      '<div class="sumrow"><span>'+T({en:'Best streak',zh:'最多连续跳对'})+'</span><b>'+best+'</b></div>'+
      '<div class="sumrow" style="border:0"><span>'+T({en:'Lotus flowers collected',zh:'收集的荷花'})+'</span><b style="color:#C0587A">'+lotus+'</b></div>'+
      '<button class="btn block" id="toRes" style="margin-top:14px">'+T({en:'See my stars',zh:'看看得了几颗星'})+'</button></div>';
    document.body.appendChild(m);
    document.getElementById('toRes').onclick=function(){m.remove();Brain.finish({score:firstTry,total:total,note:{en:'Perfect hops '+firstTry+' of '+total,zh:'一次跳对 '+firstTry+' / '+total}})};
  }
  build();
});

</script></body></html>
