<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Buddy</title><link rel="stylesheet" href="../../../shared/style.css"><style>.seq{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.seq div{min-width:64px;padding:12px 8px;border-radius:14px;background:var(--surface-2);border:1.5px solid var(--line);font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums}.seq .q{border:2px dashed var(--primary);background:var(--primary-soft);color:var(--primary)}</style></head>
<body><div class="wrap"></div>
<script src="../../../shared/icons.js"></script>
<script src="../../../shared/common.js" data-root="../../../"></script>
<script>
var PATH='games/logic/number-patterns/index.html',T=Brain.T,ZH=Brain.LANG==='zh';

Brain.run({id:'number-patterns',cat:'logic',icon:'sequence',title:{en:'Number Patterns',zh:'数字规律'},
 rules:{en:'A row of numbers follows a <b>pattern</b>.<br><br>Example: 2, 4, 6, 8 … the next is <b>10</b> (add 2 each time).<br><br>Tap the number that comes next.',zh:'一排数字按<b>规律</b>排列。<br><br>例如：2、4、6、8……下一个是 <b>10</b>（每次加 2）。<br><br>请选出下一个数。'}},
function(L){
  var M=[
   function(){var a=Brain.rand(1,5);return{s:[a,a+1,a+2,a+3],n:a+4,why:{en:'Add 1 each time',zh:'每次加 1'}}},
   function(){var a=Brain.rand(1,9),d=Brain.pick([2,5,10]);return{s:[0,1,2,3].map(i=>a+d*i),n:a+d*4,why:{en:'Add '+d+' each time',zh:'每次加 '+d}}},
   function(){var d=Brain.rand(2,5),a=d*Brain.rand(6,10);return{s:[0,1,2,3].map(i=>a-d*i),n:a-d*4,why:{en:'Take away '+d+' each time',zh:'每次减 '+d}}},
   function(){var a=Brain.rand(1,3);return{s:[0,1,2,3].map(i=>a*Math.pow(2,i)),n:a*16,why:{en:'Double it each time',zh:'每次乘以 2'}}},
   function(){var a=Brain.rand(1,5);return{s:[0,1,2,3].map(i=>a+i*(i+1)/2),n:a+10,why:{en:'Add 1, then 2, then 3, then 4',zh:'依次加 1、2、3、4'}}},
   function(){var a=Brain.rand(1,5),b=Brain.rand(10,15);return{s:[a,b,a+1,b+1,a+2],n:b+2,why:{en:'Two rows take turns, each adds 1',zh:'两组数交替出现，每组加 1'}}},
   function(){return{s:[1,4,9,16],n:25,why:{en:'1×1, 2×2, 3×3, 4×4, then 5×5',zh:'1×1、2×2、3×3、4×4，接着 5×5'}}},
   function(){var a=Brain.rand(1,3);return{s:[a,a*3,a*9],n:a*27,why:{en:'Times 3 each time',zh:'每次乘以 3'}}},
   function(){var a=Brain.rand(1,3),b=Brain.rand(2,4);return{s:[a,b,a+b,a+2*b],n:2*a+3*b,why:{en:'Each number is the two before it added',zh:'每个数等于前两个数相加'}}}];
  /* each level unlocks one more kind of rule; earlier kinds keep appearing so it never jumps */
  var avail=M.slice(0,Math.min(M.length,L<=2?L:L-1));
  Brain.quiz({rounds:8,make:function(){var q=Brain.pick(avail.slice(-3))(),s=new Set([q.n]);
    [q.n+1,q.n-1,q.n+2,q.n-2,q.n+10].forEach(v=>{if(s.size<(L<=3?3:4)&&v>=0)s.add(v)});
    return{q:'<p class="qline">'+T({en:'What comes next?',zh:'下一个数是几？'})+'</p><div class="seq">'+q.s.map(x=>'<div>'+x+'</div>').join('')+'<div class="q">?</div></div>',
      choices:Brain.shuffle([...s]).map(v=>({html:v,v:v})),answer:q.n,cols:s.size===3?3:2,explain:{en:'Answer: '+q.n+'. '+q.why.en,zh:'答案是 '+q.n+'。'+q.why.zh}}}});
});
</script></body></html>
