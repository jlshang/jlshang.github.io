<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Buddy</title><link rel="stylesheet" href="../../../shared/style.css"><style>.items{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:14px 8px 12px;text-align:center;font-size:1.1rem;font-weight:700;color:var(--ink);font-family:inherit}.item .e{width:60px;height:60px;display:block;margin:0 auto 6px}.pick{cursor:pointer}.pick.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 2px var(--primary) inset}.pick.miss{box-shadow:0 0 0 2px var(--warn) inset}.pick.bad{border-color:var(--warn);background:var(--warn-soft)}</style></head>
<body><div class="wrap"></div>
<script src="../../../shared/icons.js"></script>
<script src="../../../shared/audio.js"></script>
<script src="../../../shared/common.js" data-root="../../../"></script>
<script>
var PATH='games/memory/shopping-list/index.html',T=Brain.T,ZH=Brain.LANG==='zh';

Brain.run({id:'shopping-list',cat:'memory',icon:'cart',title:{en:'Shopping List',zh:'购物清单'},
 rules:{en:'You will see a short <b>shopping list</b>.<br><br>Look for as long as you like, then tap <b>I\'m ready</b>.<br><br>Pick the items that were on your list.',zh:'屏幕上会出现一张<b>购物清单</b>。<br><br>想看多久都可以，记住了就点<b>我记住了</b>。<br><br>然后把清单上的东西选出来。'}},
function(L){
  var FOOD=Object.keys(ITEMS).map(k=>[ITEMS[k].svg,T(ITEMS[k])]),R=3,r=0,score=0,total=0,w=document.querySelector('.wrap');
  var n=2+Math.ceil(L/2);  /* L1: 3 items ... L10: 7 items */
  w.insertAdjacentHTML('beforeend','<div class="status" id="st"></div><div id="stage" class="stack" style="margin-top:12px"></div><div id="fb" class="feedback"></div>');
  var stage=document.getElementById('stage'),fb=document.getElementById('fb');
  function round(){
    if(r>=R)return Brain.finish({score:score,total:total});
    r++;fb.textContent='';var pool=Brain.shuffle(FOOD),list=pool.slice(0,n),opts=Brain.shuffle(pool.slice(0,n+Math.min(4,Math.max(2,n-1))));
    document.getElementById('st').innerHTML='<span>'+T({en:'List '+r+' of '+R,zh:'第 '+r+' 张 / 共 '+R+' 张'})+'</span><span>'+T({en:n+' items',zh:n+' 样东西'})+'</span>';Brain.progress(r-1,R);
    stage.innerHTML='<div class="items">'+list.map(f=>'<div class="item"><span class="e">'+f[0]+'</span>'+f[1]+'</div>').join('')+'</div><button class="btn block" id="ready">'+T({en:"I'm ready",zh:'我记住了'})+'</button>';
    Brain.speak(list.map(f=>f[1]).join(Brain.LANG==='zh'?'，':', '));
    document.getElementById('ready').onclick=function(){
      stage.innerHTML='<p class="center" style="margin:0">'+T({en:'Which items were on your list? Pick <b>'+n+'</b>.',zh:'清单上有哪些东西？请选出 <b>'+n+'</b> 样。'})+'</p><div class="items">'+opts.map((f,i)=>'<button class="item pick" data-i="'+i+'"><span class="e">'+f[0]+'</span>'+f[1]+'</button>').join('')+'</div><button class="btn block" id="check">'+T({en:'Check my answer',zh:'看看答案'})+'</button>';
      stage.querySelectorAll('.pick').forEach(b=>b.onclick=()=>b.classList.toggle('sel'));
      document.getElementById('check').onclick=function(){
        var got=0,wrong=0;stage.querySelectorAll('.pick').forEach(function(b){var on=list.includes(opts[b.dataset.i]),sel=b.classList.contains('sel');b.onclick=null;
          if(on&&sel)got++;else if(on)b.classList.add('miss');else if(sel){wrong++;b.classList.add('bad');b.classList.remove('sel')}if(on)b.classList.add('sel')});
        var pts=Math.max(0,got-wrong);score+=pts;total+=n;
        Brain.say(fb,pts===n,pts===n?{en:'Perfect memory!',zh:'全记住了，真棒！'}:{en:'You remembered '+got+' of '+n,zh:'记住了 '+got+' 样，共 '+n+' 样'});
        this.textContent=T(r<R?{en:'Next list',zh:'下一张'}:{en:'See results',zh:'看成绩'});this.onclick=round;};
    };
  }round();
});
</script></body></html>
