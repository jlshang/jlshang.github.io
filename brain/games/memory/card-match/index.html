<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Buddy</title><link rel="stylesheet" href="../../../shared/style.css"><style>.board{display:grid;gap:12px;margin-top:12px}.mc{aspect-ratio:3/4;border-radius:18px;border:0;cursor:pointer;padding:14px;background:var(--memory);background-image:radial-gradient(rgba(255,255,255,.18) 2px,transparent 2.5px);background-size:14px 14px;box-shadow:0 3px 0 rgba(0,0,0,.15)}.mc.open{background:var(--surface);box-shadow:0 0 0 1.5px var(--line) inset,var(--shadow)}.mc.gone{background:var(--good-soft);box-shadow:0 0 0 2px var(--good) inset;cursor:default}</style></head>
<body><div class="wrap"></div>
<script src="../../../shared/icons.js"></script>
<script src="../../../shared/common.js" data-root="../../../"></script>
<script>
var PATH='games/memory/card-match/index.html',T=Brain.T,ZH=Brain.LANG==='zh';

Brain.run({id:'card-match',cat:'memory',icon:'memory',title:{en:'Card Match',zh:'翻牌配对'},
 rules:{en:'All the cards are face down.<br><br>Tap two cards to turn them over. If the pictures <b>match</b>, they stay open.<br><br>Try to remember where each picture is.',zh:'所有的牌都扣着。<br><br>每次翻开两张，如果图案<b>一样</b>，就会一直翻着。<br><br>试着记住每张图案的位置。'}},
function(L){
  var P=[3,3,4,4,5,5,6,6,7,8][L-1],deck=Brain.shuffle(Brain.shuffle(Object.keys(ITEMS)).slice(0,P).flatMap(x=>[x,x])),open=[],found=0,tries=0,busy=false,w=document.querySelector('.wrap');
  w.insertAdjacentHTML('beforeend','<div class="status" id="st"></div><div id="board" class="board"></div><div id="fb" class="feedback"></div>');
  var board=document.getElementById('board'),fb=document.getElementById('fb');board.style.gridTemplateColumns='repeat('+(P<=3?3:4)+',1fr)';
  function upd(){Brain.progress(found,P);document.getElementById('st').innerHTML='<span>'+T({en:'Pairs: '+found+' of '+P,zh:'已配对 '+found+' / '+P})+'</span><span>'+T({en:'Tries: ',zh:'翻了 '})+tries+T({en:'',zh:' 次'})+'</span>'}
  deck.forEach(function(k){var b=document.createElement('button');b.className='mc';b.setAttribute('aria-label','card');
    b.onclick=function(){if(busy||b.classList.contains('open'))return;b.classList.add('open');b.innerHTML=ITEMS[k].svg;open.push([b,k]);
      if(open.length===2){tries++;busy=true;var a=open[0],c=open[1];
        if(a[1]===c[1])setTimeout(function(){a[0].classList.add('gone');c[0].classList.add('gone');found++;open=[];busy=false;Brain.say(fb,true,{en:'A match!',zh:'配对成功！'});upd();
          /* score: generous allowance of extra tries before points drop */
          if(found===P){var extra=Math.max(0,tries-P*2);Brain.finish({score:Math.max(Math.ceil(P*.6),P-Math.floor(extra/2)),total:P,note:{en:'Finished in '+tries+' tries',zh:'共翻了 '+tries+' 次'}})}},450);
        else setTimeout(function(){[a,c].forEach(x=>{x[0].classList.remove('open');x[0].innerHTML=''});open=[];busy=false;fb.textContent=''},1400);
        upd()}};
    board.appendChild(b)});upd();
});
</script></body></html>
