<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Buddy</title><link rel="stylesheet" href="../../../shared/style.css"><style></style></head>
<body><div class="wrap"></div>
<script src="../../../shared/icons.js"></script>
<script src="../../../shared/common.js" data-root="../../../"></script>
<script>
var PATH='games/observation/odd-one-out/index.html',T=Brain.T,ZH=Brain.LANG==='zh';

var LIGHT={'#D0633A':'#E8A184','#6A5AC8':'#A99EE3','#2F6DB0':'#86AEDB','#2C8468':'#7FC0AA','#A8487A':'#D593B6','#B9801F':'#DDB76E'};
var NEAR={'#D0633A':'#DE875F','#6A5AC8':'#8A7BD8','#2F6DB0':'#5690C8','#2C8468':'#52A386','#A8487A':'#C06B98','#B9801F':'#CF9E47'};
Brain.run({id:'odd-one-out',cat:'observation',icon:'observation',title:{en:'Odd One Out',zh:'找不同'},
 rules:{en:'All the shapes look the same, except <b>one</b>.<br><br>It may differ in <b>shape</b>, <b>color</b>, or <b>direction</b>.<br><br>Find it and tap it. You can keep looking if you miss.',zh:'这些图形看起来都一样，只有<b>一个</b>不同。<br><br>可能是<b>形状</b>、<b>颜色</b>或<b>方向</b>不同。<br><br>找到它点一下，点错了可以继续找。'}},
function(L){
  var size=L<=3?3:L<=7?4:5,N=size*size;
  Brain.quiz({rounds:6,retry:true,make:function(){
    var c=Brain.pick(Brain.COLORS),base,diff;
    if(L<=2){var p=Brain.pick([['circle','square'],['triangle','circle'],['star','square'],['heart','diamond']]);base=Brain.shape(p[0],c);diff=Brain.shape(p[1],c)}
    else if(L<=4){base=Brain.shape('drop',c);diff=Brain.shape('drop',LIGHT[c])}
    else if(L<=6){var k=Brain.pick(['arrow','moon','heart']);base=Brain.shape(k,c,0);diff=Brain.shape(k,c,L===5?180:90)}
    else if(L<=8){var p2=Brain.pick([['circle','hexagon'],['square','diamond']]);base=Brain.shape(p2[0],c);diff=Brain.shape(p2[1],c,p2[1]==='diamond'?0:0)}
    else{base=Brain.shape('circle',c);diff=Brain.shape('circle',NEAR[c])}
    var odd=Brain.rand(0,N-1);
    return{q:'<p class="qline" style="margin:0">'+T({en:'Tap the one that is different',zh:'点出不一样的那个'})+'</p>',choices:Array.from({length:N},(_,i)=>({html:i===odd?diff:base,v:i})),answer:odd,cols:size,tile:true,
      hint:{en:'Look again, it is close!',zh:'再仔细看看，差一点！'}}}});
});
</script></body></html>
