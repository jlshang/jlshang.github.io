<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Buddy</title><link rel="stylesheet" href="../../../shared/style.css"><style>.word{font-size:4.2rem;font-weight:900;letter-spacing:.02em;padding:22px 0}</style></head>
<body><div class="wrap"></div>
<script src="../../../shared/icons.js"></script>
<script src="../../../shared/common.js" data-root="../../../"></script>
<script>
var PATH='games/focus/color-match/index.html',T=Brain.T,ZH=Brain.LANG==='zh';

var COLORS=[{n:{en:'RED',zh:'红'},c:'#C62828'},{n:{en:'BLUE',zh:'蓝'},c:'#1565C0'},{n:{en:'GREEN',zh:'绿'},c:'#2E7D32'},{n:{en:'ORANGE',zh:'橙'},c:'#E65100'}];
Brain.run({id:'color-match',cat:'focus',icon:'colors',title:{en:'Color Match',zh:'看颜色'},
 rules:{en:'You will see a color word painted in some color.<br><br>Tap the <b>color of the paint</b>, not what the word says.<br><br>Example: if you see <b style="color:#1565C0">RED</b>, tap <b>BLUE</b>.',zh:'屏幕上的颜色字，本身涂着某种颜色。<br><br>请点<b>字的颜色</b>，不要管字写的是什么。<br><br>例如：看到 <b style="color:#1565C0">红</b>，应该点<b>蓝</b>。'}},
function(L){
  /* more colors and more "tricky" words as levels rise */
  var k=L<=2?2:L<=5?3:4,trick=Math.min(.85,.25+L*.06),set=COLORS.slice(0,k);
  Brain.quiz({rounds:10,make:function(){
    var word=Brain.pick(set),ink=Math.random()<trick?Brain.pick(set.filter(x=>x!==word)):word;
    return{q:'<p class="qline">'+T({en:'What color is the paint?',zh:'这个字是什么颜色？'})+'</p><div class="word" style="color:'+ink.c+'">'+T(word.n)+'</div>',
      choices:set.map(c=>({html:T(c.n),v:c.n.en})),answer:ink.n.en,cols:k===3?3:2,
      explain:{en:'The paint color is '+ink.n.en,zh:'字的颜色是'+ink.n.zh}}}});
});
</script></body></html>
