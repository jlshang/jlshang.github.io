<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Buddy</title><link rel="stylesheet" href="../../../shared/style.css"><style>.target{display:flex;align-items:center;justify-content:center;gap:14px;font-weight:700}.target span{width:56px;height:56px;display:block}.fg{display:grid;gap:8px;margin-top:12px}.fc{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:16%;cursor:pointer;box-shadow:var(--shadow)}.fc.hit{background:var(--good-soft);box-shadow:0 0 0 2.5px var(--good) inset}</style></head>
<body><div class="wrap"></div>
<script src="../../../shared/icons.js"></script>
<script src="../../../shared/common.js" data-root="../../../"></script>
<script>
var PATH='games/focus/find-target/index.html',T=Brain.T,ZH=Brain.LANG==='zh';

Brain.run({id:'find-target',cat:'focus',icon:'eyeTarget',title:{en:'Find Them All',zh:'全部找出来'},
 rules:{en:'Look at the shape at the top.<br><br>Find and tap <b>every</b> matching shape on the board.<br><br>When you find them all, the next board appears.',zh:'先看上方的目标图形。<br><br>在下面把<b>所有</b>一样的图形都点出来。<br><br>全部找到后，会进入下一轮。'}},
function(L){
  /* bigger boards, more targets, and look-alike distractors as levels rise */
  var size=L<=2?3:L<=5?4:5,boards=3,b=0,score=0,total=0,w=document.querySelector('.wrap');
  w.insertAdjacentHTML('beforeend','<div class="status" id="st"></div><div class="card target" id="tg"></div><div id="fg" class="fg"></div><div id="fb" class="feedback"></div>');
  var fg=document.getElementById('fg'),fb=document.getElementById('fb');fg.style.gridTemplateColumns='repeat('+size+',1fr)';
  function board(){
    if(b>=boards)return Brain.finish({score:score,total:total});
    b++;fb.textContent='';var N=size*size,k=Math.min(N-2,2+Math.floor(L/2)+Brain.rand(0,1)),found=0,miss=0;
    var shapes=Brain.shuffle(Brain.SHAPES),colors=Brain.shuffle(Brain.COLORS),tS=shapes[0],tC=colors[0];
    document.getElementById('tg').innerHTML='<span>'+Brain.shape(tS,tC)+'</span>'+T({en:'Find all of these',zh:'把它们全找出来'});
    document.getElementById('st').innerHTML='<span>'+T({en:'Board '+b+' of '+boards,zh:'第 '+b+' 轮 / 共 '+boards+' 轮'})+'</span><span id="cnt"></span>';
    var cells=Array.from({length:N},(_,i)=>i<k?{s:tS,c:tC,t:1}:(L>=6&&Math.random()<.5?{s:tS,c:colors[1+Brain.rand(0,1)]}:(L>=8&&Math.random()<.5?{s:shapes[1],c:tC}:{s:Brain.pick(shapes.slice(1,3)),c:Brain.pick(colors.slice(1,4))})));
    fg.innerHTML='';function cnt(){document.getElementById('cnt').textContent=T({en:'Found ',zh:'已找到 '})+found+' / '+k;Brain.progress((b-1)+found/k,boards)}
    Brain.shuffle(cells).forEach(function(c){var e=document.createElement('button');e.className='fc';e.innerHTML=Brain.shape(c.s,c.c);
      e.onclick=function(){if(e.classList.contains('hit'))return;
        if(c.t){e.classList.add('hit');found++;cnt();if(found===k){score+=Math.max(0,k-miss);total+=k;Brain.say(fb,true,{en:'All found!',zh:'全部找到了！'});setTimeout(board,1100)}}
        else{miss++;e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');Brain.say(fb,false,{en:'Not that one. Compare with the top.',zh:'不是这个，和上面对比一下。'})}};
      fg.appendChild(e)});cnt();
  }board();
});
</script></body></html>
