<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Buddy</title><link rel="stylesheet" href="../../../shared/style.css"><style>
.order{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#FFFBF2;border:1.5px solid #EAD9B8;border-radius:18px;box-shadow:var(--shadow);position:relative}
.order:before{content:"";position:absolute;left:50%;top:-7px;width:14px;height:14px;border-radius:50%;background:#D0633A;transform:translateX(-50%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.order .fishpic{width:84px;height:52px;flex:none}
.order .txt{flex:1;font-weight:800;font-size:1.1rem;line-height:1.3}
.order .txt small{display:block;font-weight:600;color:var(--muted);font-size:.9rem}
.order.wiggle{animation:wig .45s}
@keyframes wig{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.dots{display:flex;gap:5px;margin-top:6px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #D6C39E;display:block}.dots i.on{background:#2C8468;border-color:#2C8468;animation:pulse .4s}
.pond{position:relative;height:430px;margin-top:12px;border-radius:28px;overflow:hidden;touch-action:manipulation;
  background:radial-gradient(120% 80% at 50% 0%,#7EC8C9 0%,#4FA3B0 45%,#2F7F95 100%);box-shadow:inset 0 0 0 6px #C9B48A,inset 0 0 0 10px #A98F63,var(--shadow)}
.pond .ripple{position:absolute;border:2px solid rgba(255,255,255,.35);border-radius:50%;animation:rip 6s linear infinite}
@keyframes rip{0%{transform:scale(.3);opacity:.0}20%{opacity:.7}100%{transform:scale(1.6);opacity:0}}
.pond .pad{position:absolute;pointer-events:none}
.pond .reed{position:absolute;bottom:-6px;pointer-events:none}
.fish{position:absolute;left:0;top:0;width:96px;height:64px;padding:6px;cursor:pointer;will-change:transform}
.fish svg{width:100%;height:100%;overflow:visible}
.fish.caught{transition:transform .7s cubic-bezier(.4,-0.3,.6,1),opacity .7s;opacity:0;pointer-events:none}
.fish.dart{pointer-events:none}
.splash{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;pointer-events:none}
.splash i{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;opacity:.9;animation:drop2 .6s ease-out forwards}
@keyframes drop2{100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.ring{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border:3px solid #fff;border-radius:50%;pointer-events:none;animation:ring .7s ease-out forwards}
@keyframes ring{100%{transform:scale(5);opacity:0}}
.net{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;pointer-events:none;animation:netSwing .45s ease-out forwards}
@keyframes netSwing{0%{transform:rotate(-40deg) scale(.6);opacity:0}40%{opacity:1}100%{transform:rotate(10deg) scale(1);opacity:0}}
.bucket{position:absolute;right:12px;bottom:12px;width:82px;height:82px;pointer-events:none;z-index:3}
.bucket b{position:absolute;left:0;right:0;top:34px;text-align:center;color:#fff;font-size:1.2rem;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.bucket.bump{animation:pulse .5s}
.bubble2{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none;animation:rise 7s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(-440px);opacity:0}}
.say2{text-align:center;font-weight:800;font-size:1.15rem;min-height:1.6em;margin-top:10px}
.say2.good{color:var(--good)}.say2.try{color:var(--warn)}
.aquarium{width:92px;height:92px;margin:0 auto}
</style></head>
<body><div class="wrap"></div>
<script src="../../../shared/icons.js"></script>
<script src="../../../shared/common.js" data-root="../../../"></script>
<script>
var PATH='games/focus/find-target/index.html',T=Brain.T,ZH=Brain.LANG==='zh';

var I=Brain.I;
/* fish drawing: body color + pattern (plain, stripes, spots) + fin color */
var FCOL=[{n:{en:'orange',zh:'橙色'},c:'#F08A24',d:'#C9661A'},{n:{en:'blue',zh:'蓝色'},c:'#3E86C6',d:'#2A5F92'},{n:{en:'yellow',zh:'黄色'},c:'#F2C744',d:'#C99A1E'},
          {n:{en:'pink',zh:'粉色'},c:'#E77FA0',d:'#B85577'},{n:{en:'green',zh:'绿色'},c:'#5DAA6E',d:'#3C7F4E'},{n:{en:'purple',zh:'紫色'},c:'#8A6ACF',d:'#624A9E'}];
var PAT=[{k:'plain',n:{en:'',zh:''}},{k:'stripes',n:{en:'striped',zh:'条纹'}},{k:'spots',n:{en:'spotted',zh:'斑点'}}];
var fid=0;
function fishSVG(f){var id='fc'+(fid++),pat='';
  if(f.p==='stripes')pat='<g clip-path="url(#'+id+')" fill="'+f.col.d+'" opacity=".85"><rect x="34" y="0" width="7" height="60"/><rect x="50" y="0" width="7" height="60"/><rect x="66" y="0" width="7" height="60"/></g>';
  if(f.p==='spots')pat='<g clip-path="url(#'+id+')" fill="#fff" opacity=".85"><circle cx="40" cy="24" r="4.5"/><circle cx="56" cy="36" r="5"/><circle cx="68" cy="22" r="3.5"/><circle cx="46" cy="40" r="3"/></g>';
  return '<svg viewBox="0 0 120 64"><defs><clipPath id="'+id+'"><path d="M18 32C28 8 70 4 96 20c6 4 10 8 12 12-2 4-6 8-12 12C70 60 28 56 18 32z"/></clipPath></defs>'+
    '<path d="M24 32L2 12c-2 12-2 28 0 40z" fill="'+f.col.d+'"/>'+
    '<path d="M18 32C28 8 70 4 96 20c6 4 10 8 12 12-2 4-6 8-12 12C70 60 28 56 18 32z" fill="'+f.col.c+'"/>'+pat+
    '<path d="M54 10c6-8 18-10 26-6-6 2-12 6-14 12z" fill="'+f.col.d+'"/><path d="M58 50c4 6 12 8 18 6-4-2-8-6-8-10z" fill="'+f.col.d+'"/>'+
    '<circle cx="92" cy="27" r="5.5" fill="#fff"/><circle cx="93.5" cy="27" r="3" fill="#1C2826"/><path d="M104 36q-4 3-8 2" stroke="#1C2826" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'}
function fname(f){return T({en:(f.pat.n.en?f.pat.n.en+' ':'')+f.col.n.en+' fish',zh:f.col.n.zh+(f.pat.n.zh?f.pat.n.zh:'')+'小鱼'})}

Brain.run({id:'find-target',cat:'focus',icon:'eyeTarget',title:{en:'Pond Catch',zh:'池塘捞鱼'},
 rules:{en:'Fish are swimming slowly in the pond.<br><br>The <b>order card</b> shows which fish to catch. Tap those fish to scoop them into your bucket.<br><br>Leave the other fish alone. The fish never run out, so take your time.',zh:'池塘里的小鱼慢慢游着。<br><br>上面的<b>订单</b>写着要捞哪种鱼，点一下就能捞进小桶。<br><br>别的鱼不要捞。鱼会一直游，不用着急。'}},
function(L){
  /* difficulty: number of fish, swim speed, and how alike the other fish look */
  var nFish=[4,5,5,6,6,7,7,8,8,9][L-1],speed=[18,20,22,24,26,28,30,32,34,36][L-1],need=L<=3?3:L<=7?4:5,ORDERS=3,minTargets=L<=8?2:1;
  var order=0,got=0,miss=0,combo=0,best=0,caughtTotal=0,requiredTotal=0,target=null,fishes=[],running=true;
  var tank=Brain.store('pond-tank')||0,w=document.querySelector('.wrap');
  w.insertAdjacentHTML('beforeend','<div class="hud" id="hud"><span class="chip" id="ord"></span><span class="chip" id="combo">'+I('flame')+'<span>0</span></span><span class="chip" style="margin-left:auto">'+I('fish')+'<span id="tank">'+tank+'</span></span></div>'+
    '<div class="order" id="card"><div class="fishpic" id="tpic"></div><div class="txt" id="ttxt"></div></div>'+
    '<div class="pond" id="pond"></div><div class="say2" id="say"></div>');
  document.getElementById('hud').appendChild(Brain.soundBtn());
  var pond=document.getElementById('pond'),say=document.getElementById('say'),card=document.getElementById('card');
  /* scenery */
  var scen='';
  [[18,60,120],[240,300,90],[60,340,70]].forEach(function(p,k){scen+='<svg class="pad" style="left:'+p[0]+'px;top:'+p[1]+'px;width:'+p[2]+'px;height:'+p[2]*.7+'px" viewBox="0 0 100 70"><path d="M50 35L96 30A46 32 0 1 1 90 18z" fill="#5FA052"/><path d="M50 35L20 20M50 35L30 60M50 35L78 58" stroke="#4A8A40" stroke-width="2"/>'+(k===0?'<circle cx="40" cy="30" r="9" fill="#F4B6C2"/><circle cx="40" cy="30" r="4" fill="#F2C744"/>':'')+'</svg>'});
  for(var r=0;r<4;r++)scen+='<div class="ripple" style="left:'+(40+r*80)+'px;top:'+(80+(r%2)*190)+'px;width:80px;height:40px;animation-delay:'+(r*1.5)+'s"></div>';
  for(var b=0;b<6;b++)scen+='<div class="bubble2" style="left:'+(30+b*60)+'px;bottom:-10px;width:'+(6+b%3*3)+'px;height:'+(6+b%3*3)+'px;animation-delay:'+(b*1.1)+'s"></div>';
  scen+='<svg class="reed" style="left:-4px;width:60px;height:120px" viewBox="0 0 60 120"><path d="M10 120C12 80 8 50 14 10M24 120C24 90 30 60 26 30M36 120c0-20 6-40 14-60" stroke="#4A8A40" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="10" y="10" width="8" height="26" rx="4" fill="#8A5A3B"/></svg>';
  scen+='<svg class="bucket" id="bucket" viewBox="0 0 80 80"><path d="M12 26h56l-6 46H18z" fill="#D0633A"/><path d="M12 26h56" stroke="#A84E2C" stroke-width="5" stroke-linecap="round"/><path d="M16 26C16 6 64 6 64 26" stroke="#8A6F55" stroke-width="3" fill="none"/><ellipse cx="40" cy="30" rx="24" ry="5" fill="#3E86C6" opacity=".6"/></svg><div class="bucket" style="pointer-events:none"><b id="bk">0</b></div>';
  pond.innerHTML=scen;
  var W=pond.clientWidth,H=pond.clientHeight;

  function randomFish(isTarget){
    if(isTarget)return{col:target.col,pat:target.pat,t:true};
    var col,pat,tries=0;
    do{ if(L<=3){col=Brain.pick(FCOL.filter(c=>c!==target.col));pat=Brain.pick(PAT)}
      else if(L<=6){if(Math.random()<.5){col=target.col;pat=Brain.pick(PAT.filter(p=>p!==target.pat))}else{col=Brain.pick(FCOL.filter(c=>c!==target.col));pat=target.pat}}
      else{col=Math.random()<.6?target.col:Brain.pick(FCOL.slice(0,3));pat=Math.random()<.6?target.pat:Brain.pick(PAT)}
      tries++}while(col===target.col&&pat===target.pat&&tries<20);
    if(col===target.col&&pat===target.pat)pat=PAT.find(p=>p!==target.pat);
    return{col:col,pat:pat,t:false}}
  function spawn(isTarget,fromEdge){
    var f=randomFish(isTarget),e=document.createElement('div');e.className='fish';f.p=f.pat.k;e.innerHTML=fishSVG(f);
    f.el=e;f.dir=Math.random()<.5?1:-1;f.x=fromEdge?(f.dir>0?-100:W+4):Brain.rand(10,W-110);f.y=Brain.rand(20,H-150);f.base=f.y;f.ph=Math.random()*6;f.v=speed*(.8+Math.random()*.4);
    e.onpointerdown=function(ev){ev.preventDefault();tapFish(f,ev)};pond.appendChild(e);fishes.push(f);return f}
  function newOrder(){
    order++;got=0;requiredTotal+=need;
    target={col:Brain.pick(FCOL),pat:L<=2?PAT[0]:Brain.pick(PAT)};
    document.getElementById('tpic').innerHTML=fishSVG({col:target.col,p:target.pat.k});
    document.getElementById('ttxt').innerHTML=T({en:'Catch '+need+' '+fname(target)+(need>1?'':''),zh:'捞 '+need+' 条'+fname(target)})+'<div class="dots">'+Array.from({length:need},()=>'<i></i>').join('')+'</div>';
    document.getElementById('ord').innerHTML=I('receipt')+T({en:'Order '+order+'/'+ORDERS,zh:'订单 '+order+'/'+ORDERS});
    fishes.forEach(f=>f.el.remove());fishes=[];
    var k=Math.max(minTargets,Math.round(nFish*.4));for(var i=0;i<nFish;i++)spawn(i<k,false);
    card.classList.remove('wiggle');void card.offsetWidth;card.classList.add('wiggle');
    Brain.speak(document.getElementById('ttxt').textContent);Brain.progress(order-1,ORDERS);
  }
  function fx(x,y,good){var s=document.createElement('div');s.className='splash';s.style.left=x+'px';s.style.top=y+'px';
    s.innerHTML=Array.from({length:8},(_,k)=>{var a=k/8*6.28;return '<i style="--dx:'+Math.cos(a)*38+'px;--dy:'+Math.sin(a)*30+'px;'+(good?'background:#FFF6C8':'')+'"></i>'}).join('');pond.appendChild(s);
    var rg=document.createElement('div');rg.className='ring';rg.style.left=x+'px';rg.style.top=y+'px';pond.appendChild(rg);
    setTimeout(()=>{s.remove();rg.remove()},800)}
  function tapFish(f,ev){
    if(!running||f.gone)return;var r=pond.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;
    if(f.t){f.gone=true;got++;caughtTotal++;combo++;best=Math.max(best,combo);tank++;Brain.store('pond-tank',tank);
      var n=document.createElement('div');n.className='net';n.innerHTML='<svg viewBox="0 0 70 70"><circle cx="30" cy="30" r="22" fill="rgba(255,255,255,.35)" stroke="#8A6F55" stroke-width="4"/><path d="M14 18l32 24M14 42l32-24M30 8v44M8 30h44" stroke="#fff" stroke-width="1.5" opacity=".7"/><path d="M46 46l20 20" stroke="#8A6F55" stroke-width="6" stroke-linecap="round"/></svg>';
      n.style.left=x+'px';n.style.top=y+'px';pond.appendChild(n);setTimeout(()=>n.remove(),500);
      fx(x,y,true);Brain.sfx('pop');setTimeout(()=>Brain.sfx('splash'),120);
      var bx=W-60-f.x,by=H-60-f.y;f.el.style.transform='translate('+(f.x+bx)+'px,'+(f.y+by)+'px) scale(.3) rotate(-30deg)';f.el.classList.add('caught');
      setTimeout(function(){f.el.remove();fishes=fishes.filter(q=>q!==f);var bk=document.getElementById('bucket');bk.classList.remove('bump');void bk.offsetWidth;bk.classList.add('bump');document.getElementById('bk').textContent=caughtTotal;
        if(got<need&&fishes.filter(q=>q.t).length<minTargets+1)spawn(true,true);spawn(false,true);if(fishes.length>nFish)trim()},650);
      document.querySelectorAll('#ttxt .dots i').forEach((d,i)=>d.classList.toggle('on',i<got));
      document.getElementById('tank').textContent=tank;
      var cc=document.getElementById('combo');cc.querySelector('span').textContent=combo;cc.classList.toggle('hot',combo>=3);cc.classList.remove('bump');void cc.offsetWidth;cc.classList.add('bump');
      say.className='say2 good';say.textContent=combo>=3?T({en:combo+' in a row! Great eye!',zh:'连续 '+combo+' 条，好眼力！'}):Brain.pick(T({en:['Nice catch!','Got one!','Well spotted!'],zh:['捞到啦！','好身手！','看得真准！']}));
      if(got>=need){running=false;Brain.sfx('ok');setTimeout(function(){Brain.toast(T({en:'Order complete!',zh:'订单完成！'}),pond,1300)},350);
        setTimeout(function(){if(order>=ORDERS)end();else{running=true;newOrder()}},1900)}
    }else{
      miss++;combo=0;var cc2=document.getElementById('combo');cc2.querySelector('span').textContent=0;cc2.classList.remove('hot');
      fx(x,y,false);Brain.sfx('soft');f.v=speed*4;f.dir=x<W/2?-1:1;f.dart=true;setTimeout(function(){f.v=speed*(.8+Math.random()*.4);f.dart=false},900);
      card.classList.remove('wiggle');void card.offsetWidth;card.classList.add('wiggle');
      say.className='say2 try';say.textContent=T({en:'Oops, it swam away. Check the order card.',zh:'哎呀，这条不对，看看订单上的鱼。'});
    }
  }
  function trim(){var extra=fishes.filter(f=>!f.t);if(extra.length){var f=extra[0];f.el.remove();fishes=fishes.filter(q=>q!==f)}}
  var last=performance.now();
  function loop(now){var dt=Math.min(.05,(now-last)/1000);last=now;
    fishes.forEach(function(f){if(f.gone)return;f.x+=f.dir*f.v*dt;f.ph+=dt*1.6;f.y=f.base+Math.sin(f.ph)*10;
      if(f.x>W-96&&f.dir>0&&!f.dart)f.dir=-1;if(f.x<0&&f.dir<0&&!f.dart)f.dir=1;
      if(f.dart&&(f.x>W+20||f.x<-120)){f.dir*=-1;f.dart=false;f.v=speed}
      f.el.style.transform='translate('+f.x+'px,'+f.y+'px) scaleX('+(f.dir>0?1:-1)+')'});
    requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
  function end(){running=false;Brain.progress(ORDERS,ORDERS);Brain.sfx('win');
    var score=Math.max(0,requiredTotal-Math.floor(miss/2));
    var m=document.createElement('div');m.className='modal';
    m.innerHTML='<div class="card"><div class="aquarium">'+I('fish')+'</div><h2>'+T({en:'Bucket full!',zh:'满满一桶！'})+'</h2>'+
      '<div class="sumrow"><span>'+T({en:'Fish caught',zh:'捞到的鱼'})+'</span><b>'+caughtTotal+'</b></div>'+
      '<div class="sumrow"><span>'+T({en:'Wrong fish tapped',zh:'捞错的次数'})+'</span><b>'+miss+'</b></div>'+
      '<div class="sumrow"><span>'+T({en:'Best streak',zh:'最多连续捞对'})+'</span><b>'+best+'</b></div>'+
      '<div class="sumrow" style="border:0"><span>'+T({en:'Fish in your pond collection',zh:'鱼塘里一共养了'})+'</span><b style="color:var(--words)">'+tank+'</b></div>'+
      '<button class="btn block" id="toRes" style="margin-top:14px">'+T({en:'See my stars',zh:'看看得了几颗星'})+'</button></div>';
    document.body.appendChild(m);
    document.getElementById('toRes').onclick=function(){m.remove();Brain.finish({score:score,total:requiredTotal,note:{en:caughtTotal+' fish caught · best streak '+best,zh:'捞到 '+caughtTotal+' 条 · 最多连续 '+best+' 条'}})};
  }
  newOrder();
});

</script></body></html>
