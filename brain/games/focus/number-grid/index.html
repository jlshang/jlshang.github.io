<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Buddy</title><link rel="stylesheet" href="../../../shared/style.css"><style>.grid{display:grid;gap:10px;margin-top:6px}.cell{aspect-ratio:1;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:1.9rem;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit;font-variant-numeric:tabular-nums}.cell.done{background:var(--good-soft);border-color:transparent;color:var(--good);box-shadow:none}.find{display:flex;justify-content:space-between;align-items:center;font-size:1.1rem;font-weight:700}.find b{font-size:2rem;color:var(--primary)}</style></head>
<body><div class="wrap"></div>
<script src="../../../shared/icons.js"></script>
<script src="../../../shared/common.js" data-root="../../../"></script>
<script>
var PATH='games/focus/number-grid/index.html',T=Brain.T,ZH=Brain.LANG==='zh';

Brain.run({id:'number-grid',cat:'focus',icon:'grid',title:{en:'Number Grid',zh:'数字方格'},
 rules:{en:'Numbers are mixed up on the board.<br><br>Tap them <b>in order</b>, starting from the number shown at the top.<br><br>There is no clock. Take your time.',zh:'方格里的数字是打乱的。<br><br>请从上方提示的数字开始，<b>按顺序</b>一个一个点。<br><br>不计时，慢慢来。'}},
function(L){
  /* L1-3: 3x3, L4-6: 4x4, L7-8: 5x5, L9-10: 5x5 counting down */
  var size=L<=3?3:L<=6?4:5,N=size*size,down=L>=9,next=down?N:1,done=0,miss=0,w=document.querySelector('.wrap');
  var start=L===1||L===4||L===7?1:1;
  w.insertAdjacentHTML('beforeend','<div class="card find"><span>'+T(down?{en:'Count down. Find:',zh:'倒着数，请找：'}:{en:'Find the number:',zh:'请找数字：'})+'</span><b id="nx"></b></div><div id="grid" class="grid"></div><div id="fb" class="feedback"></div>');
  var grid=document.getElementById('grid'),fb=document.getElementById('fb');grid.style.gridTemplateColumns='repeat('+size+',1fr)';
  function upd(){document.getElementById('nx').textContent=next;Brain.progress(done,N)}
  Brain.shuffle(Array.from({length:N},(_,i)=>i+1)).forEach(function(n){
    var b=document.createElement('button');b.className='cell';b.textContent=n;
    b.onclick=function(){if(b.classList.contains('done'))return;
      if(n===next){b.classList.add('done');done++;next+=down?-1:1;fb.textContent='';upd();
        if(done===N)Brain.finish({score:Math.max(0,N-miss),total:N,note:miss?{en:miss+' extra taps',zh:'点错 '+miss+' 次'}:{en:'No mistakes!',zh:'一次都没点错！'}})}
      else{miss++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');Brain.say(fb,false,{en:'Look for '+next,zh:'找一找 '+next})}};
    grid.appendChild(b)});
  upd();
});
</script></body></html>
