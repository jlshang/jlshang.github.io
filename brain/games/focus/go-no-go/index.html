<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Buddy</title><link rel="stylesheet" href="../../../shared/style.css"><style>
.orchard{position:relative;height:330px;margin-top:10px;border-radius:26px;overflow:hidden;box-shadow:var(--shadow);background:linear-gradient(#CFE8F2 0%,#E8F3E4 55%,#9FCB86 56%,#8DBE74 100%)}
.orchard .trees{position:absolute;left:0;right:0;top:40px;height:140px}
.orchard .tree{transform-box:fill-box;transform-origin:50% 100%;animation:treeSway 5s ease-in-out infinite}
@keyframes treeSway{50%{transform:rotate(1.6deg)}}
.cloud{position:absolute;height:22px;border-radius:20px;background:#fff;opacity:.9;pointer-events:none;animation:cloud 40s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:30px;height:30px;left:14px;top:-14px}.cloud:after{width:22px;height:22px;left:36px;top:-8px}
@keyframes cloud{0%{transform:translateX(-120px)}100%{transform:translateX(480px)}}
.leaf{position:absolute;width:12px;height:8px;border-radius:0 8px 0 8px;background:#6DB05E;pointer-events:none;animation:leaf 4s ease-in forwards}
@keyframes leaf{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(60px,130px) rotate(540deg);opacity:0}}
.orchard .sunx{animation:sunPulse 4s ease-in-out infinite;position:absolute;right:26px;top:16px;width:46px;height:46px;border-radius:50%;background:#F7D774;box-shadow:0 0 0 10px rgba(247,215,116,.3)}
.chute{position:absolute;left:0;right:0;top:206px;height:26px;background:#B9885A;border-top:6px solid #9A6E45;border-bottom:6px solid #7E5836}
.zone{position:absolute;top:150px;width:120px;height:90px;border:4px dashed rgba(255,255,255,.9);border-radius:18px;background:rgba(255,255,255,.18);transition:background .2s}
.zone.has{background:rgba(255,236,150,.45);border-color:#FFE066}
.zone b{position:absolute;left:0;right:0;top:-30px;text-align:center;color:#fff;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.4);font-size:1rem}
.apple{position:absolute;top:156px;width:60px;height:60px;will-change:transform}
.apple.picked{transition:transform .6s cubic-bezier(.4,-0.4,.6,1),opacity .6s;opacity:0}
.basket{position:absolute;left:50%;bottom:6px;width:110px;height:76px;margin-left:-55px}
.basket b{position:absolute;left:0;right:0;top:34px;text-align:center;color:#fff;font-size:1.2rem;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.basket.bump{animation:squash .45s}
@keyframes squash{30%{transform:scale(1.12,.86)}60%{transform:scale(.95,1.06)}100%{transform:none}}
@keyframes sunPulse{50%{box-shadow:0 0 0 18px rgba(247,215,116,.18)}}
.compost.gulp{animation:squash .4s}
.bee{position:absolute;width:22px;height:18px;pointer-events:none;animation:bee 11s ease-in-out infinite}
@keyframes bee{0%,100%{transform:translate(40px,120px)}30%{transform:translate(200px,70px)}60%{transform:translate(300px,130px)}80%{transform:translate(150px,100px)}}
.compost{position:absolute;right:8px;bottom:10px;width:70px;height:60px}
.wantcard{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#FFFBF2;border:1.5px solid #EAD9B8;border-radius:18px;box-shadow:var(--shadow)}
.wantcard .pics{display:flex;gap:4px}.wantcard .pics span{width:40px;height:40px;display:block}
.wantcard .txt{font-weight:800;font-size:1.05rem;line-height:1.3}.wantcard .txt small{display:block;color:var(--muted);font-weight:600;font-size:.88rem}
.wantcard.flip{animation:toastIn2 .5s}
.pickbtn{width:100%;min-height:96px;margin-top:12px;font-size:1.5rem;border-radius:24px}
.pickbtn svg{width:34px;height:34px}
.say2{text-align:center;font-weight:800;font-size:1.1rem;min-height:1.6em;margin-top:8px}.say2.good{color:var(--good)}.say2.try{color:var(--warn)}
.cratebar{flex:1;height:14px;border-radius:9px;background:#EDE7DB;overflow:hidden;min-width:80px}.cratebar i{display:block;height:100%;background:#D8413A;transition:width .3s}
</style></head>
<body><div class="wrap"></div>
<script src="../../../shared/icons.js"></script>
<script src="../../../shared/audio.js"></script>
<script src="../../../shared/common.js" data-root="../../../"></script>
<script>
var PATH='games/focus/go-no-go/index.html',T=Brain.T,ZH=Brain.LANG==='zh';

var I=Brain.I;
function appleSVG(kind){var body=kind==='green'?'#7DBA3E':kind==='yellow'?'#F2C744':'#D8413A',shade=kind==='green'?'#5E9A2A':kind==='yellow'?'#C99A1E':'#B02F2A',spots='';
  if(kind.indexOf('bad')===0){body='#B96A45';shade='#8A4A30';spots='<circle cx="22" cy="34" r="5" fill="#6B3A22"/><circle cx="38" cy="26" r="3.5" fill="#6B3A22"/><circle cx="34" cy="42" r="4" fill="#7A4630"/>'}
  if(kind==='badlight'){body='#D8413A';shade='#B02F2A';spots='<circle cx="36" cy="38" r="6" fill="#7A4630"/><circle cx="24" cy="28" r="2.6" fill="#7A4630"/>'}
  if(kind==='badgreen'){body='#7DBA3E';shade='#5E9A2A';spots='<circle cx="36" cy="38" r="6" fill="#7A4630"/><circle cx="24" cy="28" r="2.6" fill="#7A4630"/>'}
  return '<svg viewBox="0 0 60 60"><ellipse cx="30" cy="56" rx="16" ry="3" fill="rgba(0,0,0,.15)"/><path d="M30 16c-4-4-18-4-20 8-2 12 6 28 14 28 3 0 4-1 6-1s3 1 6 1c8 0 16-16 14-28-2-12-16-12-20-8z" fill="'+body+'"/><path d="M44 22c4 8 2 20-6 26 8-2 12-12 10-22z" fill="'+shade+'" opacity=".5"/>'+spots+'<path d="M30 16c0-4 1-7 4-10" stroke="#6B4A2B" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M32 10c4-4 9-4 12-2-3 4-8 4-12 2z" fill="#4E9A4E"/><ellipse cx="20" cy="26" rx="4" ry="6" fill="#fff" opacity=".3"/></svg>'}
var BASKET='<svg class="basket-svg" viewBox="0 0 110 76"><path d="M8 26h94l-10 46H18Z" fill="#C9914F"/><path d="M8 26h94" stroke="#9A6E45" stroke-width="6" stroke-linecap="round"/><path d="M14 40h82M16 54h78" stroke="#A8743F" stroke-width="3"/><path d="M34 26V70M55 26v46M76 26V70" stroke="#A8743F" stroke-width="3"/><path d="M22 26C22 2 88 2 88 26" stroke="#9A6E45" stroke-width="5" fill="none"/></svg>';
var BIN='<svg viewBox="0 0 70 60"><path d="M8 18h54l-6 40H14Z" fill="#6E8A5A"/><path d="M4 18h62" stroke="#556E44" stroke-width="6" stroke-linecap="round"/><path d="M28 30l6 6 8-10" stroke="#C9E0B4" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';

Brain.run({id:'go-no-go',music:'orchard',cat:'focus',icon:'traffic',title:{en:'Apple Orchard',zh:'果园收苹果'},
 rules:{en:'Apples roll slowly down the wooden chute.<br><br>When a <b>good apple</b> is inside the dashed box, tap <b>Pick</b> to put it in the basket.<br><br>Let <b>bruised apples</b> roll past into the compost bin. Do nothing for those.',zh:'苹果会沿着木槽慢慢滚过来。<br><br><b>好苹果</b>滚进虚线框时，点<b>摘下</b>放进篮子。<br><br><b>有烂斑的苹果</b>让它滚过去，进堆肥桶，不用点。'},
 goal:{en:'Fill the basket. Pass with at least 6 in 10 good choices; stars for fewer mistakes.',zh:'把篮子装满就结束。判断对的要达到六成才能过关，错得越少星星越多。'}},
function(L){
  /* speed = seconds an apple spends crossing the dashed box; bad apple share rises slowly */
  var NEED=[6,6,7,7,8,8,9,9,10,10][L-1],CROSS=[3.4,3.2,3.0,2.8,2.6,2.5,2.4,2.2,2.1,2.0][L-1],badRate=Math.min(.45,.25+L*.02),subtle=L>=4,switchAt=L>=7?Math.ceil(NEED/2):99;
  var got=0,right=0,wrong=0,decisions=0,apples=[],want='red',running=true,w=document.querySelector('.wrap');
  w.insertAdjacentHTML('beforeend','<div class="hud" id="hud"><span class="chip" style="flex:1;min-width:0">'+I('cart')+'<span class="cratebar"><i id="bar"></i></span><span id="cnt"></span></span></div>'+
    '<div class="wantcard" id="want"></div>'+
    '<div class="orchard" id="or"><div class="sunx"></div><svg class="trees" viewBox="0 0 400 140" preserveAspectRatio="none">'+
      [30,120,230,330].map((x,i)=>'<g class="tree" style="animation-delay:'+(i*.7)+'s"><rect x="'+(x+26)+'" y="80" width="12" height="60" fill="#8A6143"/><circle cx="'+(x+32)+'" cy="60" r="'+(38+i%2*6)+'" fill="'+(i%2?'#6DB05E':'#5FA052')+'"/>'+[0,1,2].map(k=>'<circle cx="'+(x+14+k*18)+'" cy="'+(50+k%2*20)+'" r="5" fill="#D8413A"/>').join('')).join('')+'</svg>'+
    '<div class="chute"></div><div class="zone" id="zone"><b>'+T({en:'Pick zone',zh:'摘果区'})+'</b></div><div class="basket" id="basket">'+BASKET+'<b id="bk">0</b></div><div class="compost">'+BIN+'</div></div>'+
    '<button class="btn pickbtn" id="pick">'+I('cart')+T({en:'Pick',zh:'摘下'})+'</button><div class="say2" id="say"></div>');
  document.getElementById('hud').appendChild(Brain.soundBtn());
  var or=document.getElementById('or'),zone=document.getElementById('zone'),say=document.getElementById('say');
  var W=or.clientWidth,ZX=W/2-60,ZW=120,speed=(ZW+60)/CROSS;zone.style.left=ZX+'px';
  function wantCard(flip){var good=want==='red'?'red':'green',el=document.getElementById('want');
    el.innerHTML='<div class="pics"><span>'+appleSVG(good)+'</span><span style="opacity:.9">'+appleSVG(want==='red'?'bad':'badgreen')+'</span></div><div class="txt">'+
      T(want==='red'?{en:'Pick good red apples',zh:'摘好的红苹果'}:{en:'Now pick good GREEN apples',zh:'现在改摘好的绿苹果'})+'<small>'+T(want==='red'?{en:'Let bruised apples roll past',zh:'有烂斑的让它滚过去'}:{en:'Let red and bruised apples roll past',zh:'红苹果和烂苹果都让它滚过去'})+'</small></div>';
    if(flip){el.classList.remove('flip');void el.offsetWidth;el.classList.add('flip')}}
  function hud(){document.getElementById('bar').style.width=(got/NEED*100)+'%';document.getElementById('bar').style.background=want==='red'?'#D8413A':'#7DBA3E';document.getElementById('cnt').textContent=got+' / '+NEED;Brain.progress(got,NEED)}
  function kind(){
    var r=Math.random();
    if(want==='red'){if(r<badRate)return subtle&&Math.random()<.6?'badlight':'bad';if(L>=6&&r<badRate+.12)return 'yellow';return 'red'}
    if(r<badRate*.6)return Math.random()<.5?'badgreen':'badlight';if(r<badRate+.15)return 'red';return 'green'}
  function isGood(k){return want==='red'?k==='red':k==='green'}
  var nextSpawn=0.6,last=performance.now();
  function spawn(){var k=kind(),e=document.createElement('div');e.className='apple';e.innerHTML=appleSVG(k);or.appendChild(e);apples.push({k:k,x:-70,el:e,done:false})}
  function loop(now){var dt=Math.min(.05,(now-last)/1000);last=now;if(!running){requestAnimationFrame(loop);return}
    nextSpawn-=dt;if(nextSpawn<=0){spawn();nextSpawn=(ZW+220)/speed}
    var inZone=false;
    apples.forEach(function(a){if(a.picked)return;a.x+=speed*dt;var rot=a.x*1.6;a.el.style.transform='translateX('+a.x+'px) rotate('+rot+'deg)';
      var c=a.x+30;a.inZone=c>ZX&&c<ZX+ZW;if(a.inZone)inZone=true;
      if(!a.done&&c>ZX+ZW){a.done=true;decisions++;if(isGood(a.k)){wrong++;say.className='say2 try';say.textContent=T({en:'A good apple rolled away. Next one!',zh:'一个好苹果滚走了，下一个接住！'});Brain.sfx('thud')}else{Brain.sfx('whoosh')}if(!isGood(a.k)){right++;say.className='say2 good';say.textContent=T({en:'Good, you let that one go.',zh:'对，这个不要。'})}}
      if(a.x>W-70&&!a.binned){a.binned=true;var cb=or.querySelector('.compost');cb.classList.remove('gulp');void cb.offsetWidth;cb.classList.add('gulp')}
      if(a.x>W+10){a.el.remove();a.gone=true}});
    apples=apples.filter(a=>!a.gone);zone.classList.toggle('has',inZone);
    requestAnimationFrame(loop)}
  document.getElementById('pick').onclick=function(){if(!running)return;
    var a=apples.find(q=>q.inZone&&!q.done&&!q.picked);
    if(!a){say.className='say2';say.style.color='var(--muted)';say.textContent=T({en:'Wait until an apple is in the dashed box.',zh:'等苹果滚进虚线框再点。'});return}
    say.style.color='';a.done=true;decisions++;
    if(isGood(a.k)){a.picked=true;right++;got++;Brain.sfx('pop');var tx=W/2-30;a.el.animate([{transform:'translate('+a.x+'px,0) rotate(0)'},{transform:'translate('+((a.x+tx)/2)+'px,-70px) rotate(200deg)',offset:.45},{transform:'translate('+tx+'px,120px) rotate(360deg) scale(.6)'}],{duration:650,easing:'ease-in-out',fill:'forwards'});setTimeout(()=>{a.el.remove();a.gone=true},660);
      var bk=document.getElementById('basket');bk.classList.remove('bump');void bk.offsetWidth;bk.classList.add('bump');document.getElementById('bk').textContent=got;
      say.className='say2 good';say.textContent=Brain.pick(T({en:['Lovely apple!','Into the basket!','Nice pick!'],zh:['好苹果！','放进篮子！','摘得好！']}));hud();
      if(got===switchAt){running=false;want='green';setTimeout(function(){Brain.sfx('sparkle');wantCard(true);hud();Brain.toast(T({en:'New order: green apples!',zh:'换订单：改摘绿苹果！'}),or,1800);Brain.speak(T({en:'Now pick good green apples',zh:'现在改摘好的绿苹果'}));apples.forEach(q=>{q.el.remove()});apples=[];setTimeout(()=>{running=true;last=performance.now()},1900)},500)}
      if(got>=NEED){running=false;setTimeout(end,700)}}
    else{wrong++;Brain.sfx('soft');a.el.animate([{transform:a.el.style.transform},{transform:'translateX('+a.x+'px) translateY(-40px) rotate(40deg)'},{transform:a.el.style.transform}],{duration:500});
      say.className='say2 try';say.textContent=want==='green'&&a.k==='red'?T({en:'We only want green apples now.',zh:'现在只要绿苹果哦。'}):a.k==='yellow'?T({en:'Only red apples go in this basket.',zh:'这个篮子只装红苹果。'}):T({en:'That one has bruises. Let it roll past.',zh:'这个有烂斑，让它滚过去。'})}
  };
  function end(){Brain.sfx('win');var acc=decisions?right/decisions:1,pass=acc>=.6,stars=!pass?0:wrong<=1?3:wrong<=3?2:1;
    Brain.toast(T({en:'Basket full!',zh:'篮子装满啦！'}),or,1500);
    setTimeout(function(){Brain.finish({pass:pass,stars:stars,score:right,total:decisions,big:T({en:got+' apples',zh:got+' 个苹果'}),note:{en:'Good choices '+right+' of '+decisions+' · mistakes '+wrong,zh:'判断正确 '+right+' / '+decisions+' · 失误 '+wrong+' 次'},failMsg:{en:'Try to get at least 6 in 10 choices right.',zh:'判断正确要达到六成才能过关，再来一次吧。'}})},1600)}
  setInterval(function(){if(!running)return;var lf=document.createElement('i');lf.className='leaf';lf.style.left=Brain.rand(10,85)+'%';lf.style.top=Brain.rand(50,90)+'px';or.appendChild(lf);setTimeout(()=>lf.remove(),4100)},2600);
  wantCard();hud();requestAnimationFrame(loop);
});

</script></body></html>
