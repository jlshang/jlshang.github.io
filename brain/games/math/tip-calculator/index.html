<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Buddy</title><link rel="stylesheet" href="../../../shared/style.css"><style>.receipt .row{display:flex;justify-content:space-between;padding:6px 2px;font-size:1.2rem}.receipt .row b{font-size:1.6rem;font-variant-numeric:tabular-nums}.hint{font-size:.95rem;color:var(--muted);margin:8px 0 0}</style></head>
<body><div class="wrap"></div>
<script src="../../../shared/icons.js"></script>
<script src="../../../shared/audio.js"></script>
<script src="../../../shared/common.js" data-root="../../../"></script>
<script>
var PATH='games/math/tip-calculator/index.html',T=Brain.T,ZH=Brain.LANG==='zh';

function $(c){return ZH?'¥'+(c%100?(c/100).toFixed(c%10?2:1):(c/100)):'$'+(c/100).toFixed(2)}
function near(ans,u,n){var s=new Set([ans]);[ans+u,ans-u,ans+2*u,ans-2*u,ans+5*u,ans+10*u,ans+3*u].forEach(v=>{if(s.size<n&&v>0)s.add(v)});return Brain.shuffle([...s])}

Brain.run({id:'tip-calculator',cat:'math',icon:ZH?'tag':'receipt',title:{en:'Tip Time',zh:'打折算账'},
 rules:{en:'You want to leave a tip after a meal.<br><br>Look at the bill and the tip percent, then tap the right <b>tip amount</b>.<br><br><span class="muted">10% means move the decimal point one place left.</span>',zh:'商店在搞打折活动。<br><br>看看<b>原价</b>和<b>打几折</b>，选出<b>打折后要付多少钱</b>。<br><br><span class="muted">打8折就是原价乘以0.8。100元打8折是80元。</span>'}},
function(L){
  Brain.quiz({rounds:6,make:function(){
    var bill,ans,q,hint='';
    if(ZH){var z=L<=3?9:L<=5?Brain.pick([8,5]):L<=7?Brain.pick([7,6,8]):Brain.pick([7.5,8.5,9.5]);
      bill=(z%1?Brain.rand(1,L<=8?5:10)*2000:Brain.rand(1,L<=3?5:15)*1000);ans=Math.round(bill*z/10);
      if(z===5)hint='5折就是原价的一半';else if(z%1)hint=z+'折 = 原价 × 0.'+String(z).replace('.','');
      q='<div class="row"><span>原价</span><b>'+$(bill)+'</b></div><div class="row"><span>折扣</span><b>打 '+z+' 折</b></div><div class="row"><span>要付</span><b>?</b></div>';}
    else{var pct=L<=3?10:L<=6?20:15;bill=Brain.rand(2,L<=3?6:9)*1000+(L>=5?Brain.rand(0,1)*500:0);ans=Math.round(bill*pct/100);
      if(pct===20)hint='20% = 10% + 10%';if(pct===15)hint='15% = 10% + half of 10%';
      q='<div class="row"><span>Bill</span><b>'+$(bill)+'</b></div><div class="row"><span>Tip</span><b>'+pct+'%</b></div><div class="row"><span>Tip amount</span><b>?</b></div>';}
    return{q:'<div class="receipt" style="text-align:left">'+q+(hint&&L<=8?'<p class="hint">'+hint+'</p>':'')+'</div>',
      choices:near(ans,ZH?500:100,L<=3?3:4).map(v=>({html:$(v),v:v})),answer:ans,cols:L<=3?3:2,explain:{en:'The answer is '+$(ans),zh:'答案是 '+$(ans)}}}});
});
</script></body></html>
