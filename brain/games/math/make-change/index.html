<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Buddy</title><link rel="stylesheet" href="../../../shared/style.css"><style>.receipt .row{display:flex;justify-content:space-between;padding:6px 2px;font-size:1.2rem}.receipt .row b{font-size:1.6rem;font-variant-numeric:tabular-nums}</style></head>
<body><div class="wrap"></div>
<script src="../../../shared/icons.js"></script>
<script src="../../../shared/common.js" data-root="../../../"></script>
<script>
var PATH='games/math/make-change/index.html',T=Brain.T,ZH=Brain.LANG==='zh';

function $(c){return ZH?'¥'+(c%100?(c/100).toFixed(c%10?2:1):(c/100)):'$'+(c/100).toFixed(2)}
function near(ans,u,n){var s=new Set([ans]);[ans+u,ans-u,ans+2*u,ans-2*u,ans+5*u,ans+10*u,ans+3*u].forEach(v=>{if(s.size<n&&v>0)s.add(v)});return Brain.shuffle([...s])}

var ITEMS_EN=['a coffee','a newspaper','a loaf of bread','a birthday card','a bag of apples','a movie ticket','a sandwich','flowers'],ITEMS_ZH=['一杯豆浆','一份报纸','一斤苹果','一把青菜','一袋馒头','一张电影票','一瓶酱油','一束鲜花'];
Brain.run({id:'make-change',cat:'math',icon:'cash',title:{en:'Make Change',zh:'买东西找零'},
 rules:{en:'You are paying at a store.<br><br>You will see the <b>price</b> and how much you <b>paid</b>.<br><br>Tap how much <b>change</b> you get back.',zh:'您在商店买东西付钱。<br><br>会显示<b>价格</b>和您<b>付了多少</b>。<br><br>请选出应该<b>找回多少钱</b>。'}},
function(L){
  Brain.quiz({rounds:8,make:function(){
    var price,paid,u;
    if(ZH){ if(L<=2){price=Brain.rand(1,9)*100;paid=1000;u=100}else if(L<=4){price=Brain.rand(11,45)*100;paid=5000;u=100}
      else if(L<=7){price=Brain.rand(11,45)*100+50;paid=5000;u=50}else{price=Brain.rand(12,88)*100+Brain.rand(1,9)*10;paid=10000;u=100}}
    else{ if(L<=2){price=Brain.rand(1,4)*100;paid=500;u=100}else if(L<=4){price=Brain.rand(4,19)*25;paid=500;u=25}
      else if(L<=7){price=Brain.rand(21,95)*10+5*Brain.rand(0,1);paid=1000;u=25}else{price=Brain.rand(501,1899);paid=2000;u=100}}
    var ans=paid-price;
    return{q:'<div class="receipt" style="text-align:left"><p class="qline">'+T({en:'You buy ',zh:'您买了'})+Brain.pick(ZH?ITEMS_ZH:ITEMS_EN)+'</p><div class="row"><span>'+T({en:'Price',zh:'价格'})+'</span><b>'+$(price)+'</b></div><div class="row"><span>'+T({en:'You pay',zh:'您付了'})+'</span><b>'+$(paid)+'</b></div><div class="row"><span>'+T({en:'Change',zh:'应找回'})+'</span><b>?</b></div></div>',
      choices:near(ans,u,L<=2?3:4).map(v=>({html:$(v),v:v})),answer:ans,cols:L<=2?3:2,explain:$(paid)+' − '+$(price)+' = '+$(ans)}}});
});
</script></body></html>
